openapi: 3.0.3
info:
  title: 예시 도서 API
  version: 1.0.0
  description: |
    API Specbook 데모용 예시 스펙입니다. 실제 서비스와 무관한 가상의 도서 관리 API입니다.
servers:
  - url: https://api.example.com
paths:
  /api/v1/books:
    get:
      summary: 도서 목록 조회
      tags: [도서]
      parameters:
        - name: page
          in: query
          description: 페이지 번호
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          description: 페이지 크기
          schema:
            type: integer
            default: 20
        - name: keyword
          in: query
          description: 제목 검색어
          schema:
            type: string
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookList'
    post:
      summary: 도서 등록
      tags: [도서]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
  /api/v1/books/{id}:
    get:
      summary: 도서 상세 조회
      tags: [도서]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          description: 존재하지 않는 도서
    delete:
      summary: 도서 삭제
      tags: [도서]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 삭제됨
components:
  schemas:
    Book:
      type: object
      properties:
        id:
          type: string
          description: 도서 식별자
        title:
          type: string
          description: 제목
        author:
          type: string
          description: 저자
        price:
          type: integer
          description: 가격(원)
        tags:
          type: array
          description: 분류 태그
          items:
            type: string
    BookInput:
      type: object
      required: [title, author]
      properties:
        title:
          type: string
        author:
          type: string
        price:
          type: integer
    BookList:
      type: object
      properties:
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/Book'
